<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma Typing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
        }

        #fallingGame {
            flex: 2;
            width: 100%;
            position: relative;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            overflow: hidden;
        }

        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to bottom, #8B4513, #A0522D);
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 36px;
            color: #333;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 100;
        }

        #stats {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: #333;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 100;
        }

        .falling-letter {
            position: absolute;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.2s ease;
        }

        .falling-letter.popped {
            animation: pop 0.5s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(0); opacity: 0; }
        }

        #keyboardArea {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f8f8;
            padding: 20px;
            gap: 20px;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-width: 800px;
            margin: 0 auto;
        }

        .key {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 30px;
            font-weight: bold;
            transition: all 0.2s ease;
            opacity: 0.1;
        }

        .key.current {
            background-color: #4CAF50;
            color: white;
            transform: scale(1.1);
            opacity: 1;
        }

        .key.finger-l-5 { background-color: #ff0000; color: white; }
        .key.finger-l-4 { background-color: #ffa500; color: white; }
        .key.finger-l-3 { background-color: #ffff00; color: black; }
        .key.finger-l-2 { background-color: #00ff00; color: black; }

        .key.finger-r-5 { background-color: #cd1717; color: white; }
        .key.finger-r-4 { background-color: #d29626; color: white; }
        .key.finger-r-3 { background-color: #dbdb20; color: black; }
        .key.finger-r-2 { background-color: #39dd39; color: black; }

        .tips-section {
            width: 400px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tips-section h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .tips-section ol {
            padding-left: 20px;
            margin: 0;
        }

        .tips-section li {
            margin-bottom: 10px;
            color: #666;
        }

        .color-legend {
            width: 200px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .color-legend h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .color-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
        }

        .color-text {
            color: #666;
        }
    </style>
</head>
<body>
    <div id="gameArea">
        <div id="fallingGame">
            <div id="score">Score: 0</div>
            <div id="stats">Slowest Letters: -</div>
            <div id="ground"></div>
        </div>
        <div id="keyboardArea">
            <div class="tips-section">
                <h3>Tips</h3>
                <ol>
                    <li>Try to ONLY watch the screen.</li>
                    <li>Start with INDEX fingers on F and J</li>
                    <li>Use CORRECT finger to type.</li>
                </ol>
            </div>
            <div class="keyboard" id="keyboard"></div>
            <div class="color-legend">
                <h3>Finger Colors</h3>
                <div class="color-item">
                    <div class="color-box" style="background-color: #00ff00;"></div>
                    <span class="color-text">Index Finger</span>
                </div>
                <div class="color-item">
                    <div class="color-box" style="background-color: #ffff00;"></div>
                    <span class="color-text">Middle Finger</span>
                </div>
                <div class="color-item">
                    <div class="color-box" style="background-color: #ffa500;"></div>
                    <span class="color-text">Ring Finger</span>
                </div>
                <div class="color-item">
                    <div class="color-box" style="background-color: #ff0000;"></div>
                    <span class="color-text">Pinky Finger</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const keyboard = document.getElementById('keyboard');
        const fallingGame = document.getElementById('fallingGame');
        const scoreElement = document.getElementById('score');
        const statsElement = document.getElementById('stats');
        let score = 0;
        let activeLetters = new Set();
        let letterToStuffy = {};
        let letterTimings = {};
        let currentFallingLetter = null;
        let letterCount = 0;
        let fastLettersCount = 0;
        const MAX_FAST_LETTERS = 2;

        // Stuffy toy backgrounds for each letter
        const stuffyToys = {
            'A': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f430.svg', // rabbit
            'B': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f43b.svg', // bear
            'C': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f408.svg', // cat
            'D': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f415.svg', // dog
            'E': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f42d.svg', // mouse
            'F': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f42f.svg', // tiger
            'G': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f405.svg', // tiger face
            'H': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f412.svg', // monkey
            'I': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f426.svg', // bird
            'J': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f427.svg', // penguin
            'K': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f414.svg', // chicken
            'L': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f40d.svg', // snake
            'M': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f42e.svg', // cow
            'N': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f402.svg', // ox
            'O': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f40e.svg', // horse
            'P': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f43a.svg', // wolf
            'Q': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f418.svg', // elephant
            'R': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f40f.svg', // ram
            'S': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f411.svg', // sheep
            'T': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f401.svg', // mouse
            'U': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f400.svg', // rat
            'V': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f439.svg', // hamster
            'W': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f43d.svg', // pig
            'X': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f428.svg', // koala
            'Y': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f43c.svg', // panda
            'Z': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f42a.svg'  // camel
        };

        function updateStats() {
            const letterStats = Object.entries(letterTimings).map(([letter, times]) => ({
                letter,
                averageTime: times.reduce((a, b) => a + b, 0) / times.length
            })).sort((a, b) => b.averageTime - a.averageTime);

            const top5 = letterStats.slice(0, 5);
            if (top5.length > 0) {
                statsElement.innerHTML = 'Slowest Letters: ' + 
                    top5.map(stat => 
                        `${stat.letter} (${(stat.averageTime / 1000).toFixed(2)}s)`
                    ).join(', ');
            }
        }

        function createFallingLetter() {
            const letter = String.fromCharCode(65 + Math.floor(Math.random() * 26)); // Random letter A-Z
            if (activeLetters.has(letter)) return; // Don't create duplicate letters

            const letterElement = document.createElement('div');
            letterElement.className = 'falling-letter';
            letterElement.textContent = letter;
            letterElement.style.backgroundImage = `url('${stuffyToys[letter]}')`;
            letterElement.style.left = `${Math.random() * (fallingGame.offsetWidth - 60)}px`;
            letterElement.style.top = '0px';
            fallingGame.appendChild(letterElement);
            activeLetters.add(letter);

            // Determine if this should be a fast letter
            const shouldBeFast = letterCount % 10 === 0 && fastLettersCount < MAX_FAST_LETTERS;
            if (shouldBeFast) {
                letterElement.classList.add('fast-letter');
                fastLettersCount++;
            }

            letterToStuffy[letter] = {
                element: letterElement,
                startTime: Date.now(),
                fallInterval: null,
                isFast: shouldBeFast
            };

            // Highlight the corresponding key
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.classList.remove('current');
                if (key.textContent === letter) {
                    key.classList.add('current');
                    key.style.opacity = '1';
                } else {
                    key.style.opacity = '0.1';
                }
            });

            let position = 0;
            const fallInterval = setInterval(() => {
                position += shouldBeFast ? 4 : 2; // Double speed for fast letters
                letterElement.style.top = `${position}px`;

                if (position > fallingGame.offsetHeight - 100) {
                    clearInterval(fallInterval);
                    letterElement.remove();
                    activeLetters.delete(letter);
                    if (letterToStuffy[letter].isFast) {
                        fastLettersCount--;
                    }
                    delete letterToStuffy[letter];
                    
                    // Reset keyboard highlight
                    const keys = document.querySelectorAll('.key');
                    keys.forEach(key => {
                        key.classList.remove('current');
                        key.style.opacity = '0.1';
                    });
                }
            }, 20);

            // Store the interval ID so we can clear it when the letter is popped
            letterToStuffy[letter].fallInterval = fallInterval;
            letterCount++;
        }

        function popLetter(letter) {
            const letterData = letterToStuffy[letter];
            if (!letterData) return;

            // Clear the falling animation
            clearInterval(letterData.fallInterval);

            // Calculate response time
            const responseTime = Date.now() - letterData.startTime;
            
            // Track timing for this letter
            if (!letterTimings[letter]) {
                letterTimings[letter] = [];
            }
            letterTimings[letter].push(responseTime);
            
            // Update stats
            updateStats();

            // Calculate score based on response time and letter speed
            const maxPoints = letterData.isFast ? 200 : 100; // Double points for fast letters
            const timeLimit = letterData.isFast ? 1000 : 2000; // Half time for fast letters
            const points = Math.max(10, Math.floor(maxPoints * (1 - Math.min(responseTime, timeLimit) / timeLimit)));
            updateScore(points);

            // Pop the letter with animation
            letterData.element.classList.add('popped');
            setTimeout(() => {
                letterData.element.remove();
                activeLetters.delete(letter);
                if (letterData.isFast) {
                    fastLettersCount--;
                }
                delete letterToStuffy[letter];
                
                // Reset keyboard highlight
                const keys = document.querySelectorAll('.key');
                keys.forEach(key => {
                    key.classList.remove('current');
                    key.style.opacity = '0.1';
                });
            }, 500);
        }

        // Start creating falling letters
        setInterval(createFallingLetter, 2000);

        function updateScore(points) {
            score += points;
            scoreElement.textContent = `Score: ${score}`;
        }

        // Finger mapping for QWERTY keyboard
        const fingerMapping = {
            'Q': 'finger-l-5', 'A': 'finger-l-5', 'Z': 'finger-l-5',
            'W': 'finger-l-4', 'S': 'finger-l-4', 'X': 'finger-l-4',
            'E': 'finger-l-3', 'D': 'finger-l-3', 'C': 'finger-l-2',
            'R': 'finger-l-2', 'F': 'finger-l-2', 'V': 'finger-l-2',
            'T': 'finger-l-2', 'G': 'finger-l-2', 'B': 'finger-l-2',
            'Y': 'finger-r-2', 'H': 'finger-r-2', 'N': 'finger-r-2',
            'U': 'finger-r-2', 'J': 'finger-r-2', 'M': 'finger-r-2',
            'I': 'finger-r-3', 'K': 'finger-r-3', ',': 'finger-r-3',
            'O': 'finger-r-4', 'L': 'finger-r-4', '.': 'finger-r-4',
            'P': 'finger-r-5', ';': 'finger-r-5', '/': 'finger-r-5'
        };

        // Create keyboard layout
        function createKeyboard() {
            const rows = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';'],
                ['Z', 'X', 'C', 'V', 'B', 'N', 'M', ',', '.', '/']
            ];

            rows.forEach(row => {
                row.forEach(key => {
                    const keyElement = document.createElement('div');
                    keyElement.className = `key ${fingerMapping[key] || ''}`;
                    keyElement.textContent = key;
                    keyboard.appendChild(keyElement);
                });
            });
        }

        // Initialize keyboard
        createKeyboard();

        document.addEventListener('keydown', (event) => {
            const key = event.key.toUpperCase();

            // Check if the pressed key matches any falling letter
            if (activeLetters.has(key) && letterToStuffy[key]) {
                popLetter(key);
            }
        });
    </script>
</body>
</html>

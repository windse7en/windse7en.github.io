<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma Typing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
        }

        #typingArea {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        #keyboardArea {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f8f8;
            padding: 20px;
            gap: 20px;
        }

        #letters {
            font-size: 48px;
            letter-spacing: 10px;
            color: #cccccc;
        }

        .typed {
            color: black !important;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-width: 800px;
            margin: 0 auto;
        }

        .key {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 30px;
            font-weight: bold;
            transition: all 0.2s ease;
            opacity: 0.1;
        }

        .key.current {
            background-color: #4CAF50;
            color: white;
            transform: scale(1.1);
            opacity: 1;
        }

        .key.finger-l-5 { background-color: #ff0000; color: white; }
        .key.finger-l-4 { background-color: #ffa500; color: white; }
        .key.finger-l-3 { background-color: #ffff00; color: black; }
        .key.finger-l-2 { background-color: #00ff00; color: black; }

        .key.finger-r-5 { background-color: #cd1717; color: white; }
        .key.finger-r-4 { background-color: #d29626; color: white; }
        .key.finger-r-3 { background-color: #dbdb20; color: black; }
        .key.finger-r-2 { background-color: #39dd39; color: black; }

        .tips-section {
            width: 400px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tips-section h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .tips-section ol {
            padding-left: 20px;
            margin: 0;
        }

        .tips-section li {
            margin-bottom: 10px;
            color: #666;
        }

        .color-legend {
            width: 200px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .color-legend h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .color-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
        }

        .color-text {
            color: #666;
        }
    </style>
</head>
<body>
    <div id="gameArea">
        <div id="typingArea">
            <div id="letters">ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
        </div>
        <div id="keyboardArea">
            <div class="tips-section">
                <h3>Tips</h3>
                <ol>
                    <li>Try to ONLY watch the screen.</li>
                    <li>Start with INDEX fingers on F and J</li>
                    <li>Use CORRECT finger to type.</li>
                </ol>
            </div>
            <div class="keyboard" id="keyboard"></div>
            <div class="color-legend">
                <h3>Finger Colors</h3>
                <div class="color-item">
                    <div class="color-box" style="background-color: #00ff00;"></div>
                    <span class="color-text">Index Finger</span>
                </div>
                <div class="color-item">
                    <div class="color-box" style="background-color: #ffff00;"></div>
                    <span class="color-text">Middle Finger</span>
                </div>
                <div class="color-item">
                    <div class="color-box" style="background-color: #ffa500;"></div>
                    <span class="color-text">Ring Finger</span>
                </div>
                <div class="color-item">
                    <div class="color-box" style="background-color: #ff0000;"></div>
                    <span class="color-text">Pinky Finger</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const letters = document.getElementById('letters');
        const keyboard = document.getElementById('keyboard');
        const lettersText = letters.textContent;
        let currentIndex = 0;
        let startTime = null;
        let lastKeyTime = null;
        let keyPressTimes = [];
        let sessionStats = [];
        let letterTimings = {}; // Track timing for each letter

        // Add timing display element
        const timingDisplay = document.createElement('div');
        timingDisplay.id = 'timingDisplay';
        timingDisplay.style.position = 'absolute';
        timingDisplay.style.top = '20px';
        timingDisplay.style.left = '50%';
        timingDisplay.style.transform = 'translateX(-50%)';
        timingDisplay.style.fontSize = '24px';
        timingDisplay.style.color = '#333';
        timingDisplay.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
        timingDisplay.style.padding = '10px';
        timingDisplay.style.borderRadius = '5px';
        timingDisplay.style.textAlign = 'center';
        document.getElementById('gameArea').appendChild(timingDisplay);

        // Add stats display element
        const statsDisplay = document.createElement('div');
        statsDisplay.id = 'statsDisplay';
        statsDisplay.style.position = 'absolute';
        statsDisplay.style.bottom = '20px';
        statsDisplay.style.left = '50%';
        statsDisplay.style.transform = 'translateX(-50%)';
        statsDisplay.style.fontSize = '18px';
        statsDisplay.style.color = '#333';
        statsDisplay.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
        statsDisplay.style.padding = '10px';
        statsDisplay.style.borderRadius = '5px';
        document.getElementById('gameArea').appendChild(statsDisplay);

        function resetGame() {
            letters.innerHTML = lettersText;
            currentIndex = 0;
            // Reset all keys to semi-transparent
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.style.opacity = '0.1';
            });
            // Reset timing
            startTime = null;
            lastKeyTime = null;
            keyPressTimes = [];
            updateTimingDisplay();
        }

        function getSlowestLetters() {
            // Convert letterTimings to array and sort by average time
            const letterStats = Object.entries(letterTimings).map(([letter, times]) => ({
                letter,
                averageTime: times.reduce((a, b) => a + b, 0) / times.length
            })).sort((a, b) => b.averageTime - a.averageTime);

            // Return top 5 slowest letters
            return letterStats.slice(0, 5);
        }

        function updateTimingDisplay() {
            if (!startTime) {
                timingDisplay.textContent = 'Ready to start!';
                return;
            }

            const currentTime = Date.now();
            const elapsedTime = (currentTime - startTime) / 1000;
            const averageTime = keyPressTimes.length > 0 
                ? (keyPressTimes.reduce((a, b) => a + b, 0) / keyPressTimes.length).toFixed(2)
                : 0;
            
            const slowestLetters = getSlowestLetters();
            let slowestLettersText = '';
            if (slowestLetters.length > 0) {
                slowestLettersText = '<br>Slowest letters: ' + 
                    slowestLetters.map(stat => 
                        `${stat.letter} (${(stat.averageTime / 1000).toFixed(2)}s)`
                    ).join(', ');
            }
            
            timingDisplay.innerHTML = `
                Time: ${elapsedTime.toFixed(2)}s | Avg: ${averageTime}s per key
                ${slowestLettersText}
            `;
        }

        function updateStatsDisplay() {
            if (sessionStats.length === 0) {
                statsDisplay.textContent = 'No stats yet';
                return;
            }

            const lastRun = sessionStats[sessionStats.length - 1];
            const avgTime = sessionStats.reduce((sum, stat) => sum + stat.totalTime, 0) / sessionStats.length;
            const bestTime = Math.min(...sessionStats.map(stat => stat.totalTime));
            
            statsDisplay.innerHTML = `
                Last Run: ${lastRun.totalTime.toFixed(2)}s (${lastRun.averageTime.toFixed(2)}s/key)<br>
                Best Time: ${bestTime.toFixed(2)}s<br>
                Average Time: ${avgTime.toFixed(2)}s
            `;
        }

        // Finger mapping for QWERTY keyboard
        const fingerMapping = {
            'Q': 'finger-l-5', 'A': 'finger-l-5', 'Z': 'finger-l-5',
            'W': 'finger-l-4', 'S': 'finger-l-4', 'X': 'finger-l-4',
            'E': 'finger-l-3', 'D': 'finger-l-3', 'C': 'finger-l-2',
            'R': 'finger-l-2', 'F': 'finger-l-2', 'V': 'finger-l-2',
            'T': 'finger-l-2', 'G': 'finger-l-2', 'B': 'finger-l-2',
            'Y': 'finger-r-2', 'H': 'finger-r-2', 'N': 'finger-r-2',
            'U': 'finger-r-2', 'J': 'finger-r-2', 'M': 'finger-r-2',
            'I': 'finger-r-3', 'K': 'finger-r-3', ',': 'finger-r-3',
            'O': 'finger-r-4', 'L': 'finger-r-4', '.': 'finger-r-4',
            'P': 'finger-r-5', ';': 'finger-r-5', '/': 'finger-r-5'
        };

        // Create keyboard layout
        function createKeyboard() {
            const rows = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';'],
                ['Z', 'X', 'C', 'V', 'B', 'N', 'M', ',', '.', '/']
            ];

            rows.forEach(row => {
                row.forEach(key => {
                    const keyElement = document.createElement('div');
                    keyElement.className = `key ${fingerMapping[key] || ''}`;
                    keyElement.textContent = key;
                    keyboard.appendChild(keyElement);
                });
            });
        }

        // Initialize keyboard
        createKeyboard();

        // Update keyboard highlight
        function updateKeyboardHighlight(currentIndex) {
            const keys = document.querySelectorAll('.key');
            const nextLetter = lettersText[currentIndex];
            
            keys.forEach(key => {
                key.classList.remove('current');
                if (key.textContent === nextLetter) {
                    key.classList.add('current');
                    key.style.opacity = '1';
                } else {
                    key.style.opacity = '0.1';
                }
            });
        }

        // Initialize with first letter highlighted
        updateKeyboardHighlight(0);

        document.addEventListener('keydown', (event) => {
            const key = event.key.toUpperCase();
            const currentLetter = lettersText[currentIndex];

            if (key === currentLetter) {
                const now = Date.now();
                
                if (!startTime) {
                    startTime = now;
                    lastKeyTime = now;
                } else {
                    const timeSinceLastKey = now - lastKeyTime;
                    keyPressTimes.push(timeSinceLastKey);
                    
                    // Track timing for this specific letter
                    if (!letterTimings[currentLetter]) {
                        letterTimings[currentLetter] = [];
                    }
                    letterTimings[currentLetter].push(timeSinceLastKey);
                    
                    lastKeyTime = now;
                }

                // Update letter color
                const span = document.createElement('span');
                span.textContent = currentLetter;
                span.className = 'typed';
                letters.innerHTML = letters.innerHTML.replace(currentLetter, span.outerHTML);

                currentIndex++;

                // Update keyboard highlight for next letter
                updateKeyboardHighlight(currentIndex);
                updateTimingDisplay();

                // Check if we've completed the sequence
                if (currentIndex >= lettersText.length) {
                    // Record stats for this run
                    const totalTime = (Date.now() - startTime) / 1000;
                    const averageTime = keyPressTimes.reduce((a, b) => a + b, 0) / keyPressTimes.length / 1000;
                    sessionStats.push({
                        totalTime,
                        averageTime,
                        keyPressTimes: [...keyPressTimes],
                        letterTimings: {...letterTimings}
                    });
                    
                    // Reset game
                    resetGame();
                    // Reset keyboard highlight to first letter
                    updateKeyboardHighlight(0);
                    // Update stats display
                    updateStatsDisplay();
                }
            }
        });
    </script>
</body>
</html>

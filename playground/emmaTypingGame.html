<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma Typing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
        }

        #characterSelector {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px;
            font-size: 16px;
            z-index: 100;
        }

        #bunnyArea {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            background-color: #e0e0e0;
        }

        #character {
            position: absolute;
            left: 50px;
            bottom: 50px;
            width: 100px;
            height: 100px;
            background-size: contain;
            background-repeat: no-repeat;
            transition: left 0.3s ease;
        }

        #food {
            position: absolute;
            right: 50px;
            bottom: 50px;
            width: 80px;
            height: 80px;
            background-size: contain;
            background-repeat: no-repeat;
            transition: transform 0.3s ease;
        }

        #counter {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 64px;
            color: #333;
        }

        #typingArea {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        #keyboardArea {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f8f8;
            padding: 20px;
            gap: 20px;
        }

        #letters {
            font-size: 48px;
            letter-spacing: 10px;
            color: #cccccc;
        }

        .typed {
            color: black !important;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-width: 800px;
            margin: 0 auto;
        }

        .key {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 30px;
            font-weight: bold;
            transition: all 0.2s ease;
            opacity: 0.1;
        }

        .key.current {
            background-color: #4CAF50;
            color: white;
            transform: scale(1.1);
            opacity: 1;
        }

        .key.finger-l-5 { background-color: #ff0000; color: white; }
        .key.finger-l-4 { background-color: #ffa500; color: white; }
        .key.finger-l-3 { background-color: #ffff00; color: black; }
        .key.finger-l-2 { background-color: #00ff00; color: black; }

        .key.finger-r-5 { background-color: #cd1717; color: white; }
        .key.finger-r-4 { background-color: #d29626; color: white; }
        .key.finger-r-3 { background-color: #dbdb20; color: black; }
        .key.finger-r-2 { background-color: #39dd39; color: black; }

        @keyframes eatFood {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(0); }
        }

        .eating {
            animation: eatFood 0.5s forwards;
        }

        /* Celebration effects */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .heart {
            position: absolute;
            font-size: 100px;
            color: #ff0000;
            animation: float 2s ease-in-out forwards;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: confetti 3s ease-in-out forwards;
        }

        @keyframes float {
            0% {
                transform: scale(0) translateY(0);
                opacity: 0;
            }
            50% {
                transform: scale(1) translateY(-50px);
                opacity: 1;
            }
            100% {
                transform: scale(0) translateY(-100px);
                opacity: 0;
            }
        }

        @keyframes confetti {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .celebration-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #ff0000;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: textPop 2s ease-in-out forwards;
        }

        @keyframes textPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
        }

        .tips-section {
            width: 400px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tips-section h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .tips-section ol {
            padding-left: 20px;
            margin: 0;
        }

        .tips-section li {
            margin-bottom: 10px;
            color: #666;
        }

        .color-legend {
            width: 200px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .color-legend h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .color-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
        }

        .color-text {
            color: #666;
        }
    </style>
</head>
<body>
    <div id="gameArea">
        <select id="characterSelector">
            <option value="bunny">Bunny & Carrot</option>
            <option value="panda">Panda & Bamboo</option>
            <option value="pooh">Winnie the Pooh & Honey</option>
            <option value="cat">Cat & Fish</option>
            <option value="zombie">Zombie & Brain</option>
            <option value="tom">Tom & Jerry</option>
            <option value="bumblebee">Bumblebee & Trump</option>
        </select>
        <div id="bunnyArea">
            <div id="counter">Food eaten: 0</div>
            <div id="character"></div>
            <div id="food"></div>
        </div>
        <div id="typingArea">
            <div id="letters">ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
        </div>
        <div id="keyboardArea">
            <div class="tips-section">
                <h3>Tips</h3>
                <ol>
                    <li>Try to ONLY watch the screen.</li>
                    <li>Start with INDEX fingers on F and J</li>
                    <li>Use CORRECT finger to type.</li>
                </ol>
            </div>
            <div class="keyboard" id="keyboard"></div>
            <div class="color-legend">
                <h3>Finger Colors</h3>
                <div class="color-item">
                    <div class="color-box" style="background-color: #00ff00;"></div>
                    <span class="color-text">Index Finger</span>
                </div>
                <div class="color-item">
                    <div class="color-box" style="background-color: #ffff00;"></div>
                    <span class="color-text">Middle Finger</span>
                </div>
                <div class="color-item">
                    <div class="color-box" style="background-color: #ffa500;"></div>
                    <span class="color-text">Ring Finger</span>
                </div>
                <div class="color-item">
                    <div class="color-box" style="background-color: #ff0000;"></div>
                    <span class="color-text">Pinky Finger</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const letters = document.getElementById('letters');
        const character = document.getElementById('character');
        const food = document.getElementById('food');
        const counter = document.getElementById('counter');
        const characterSelector = document.getElementById('characterSelector');
        const keyboard = document.getElementById('keyboard');
        const lettersText = letters.textContent;
        let currentIndex = 0;
        let foodEaten = 0;

        // Character configurations
        const characters = {
            bunny: {
                character: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f430.svg',
                food: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f955.svg',
                counterText: 'Carrots eaten'
            },
            panda: {
                character: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f43c.svg',
                food: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f38d.svg',
                counterText: 'Bamboo eaten'
            },
            pooh: {
                character: 'https://i.ibb.co/Kx8X07SL/1.png',
                food: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f36f.svg',
                counterText: 'Honey pots eaten'
            },
            cat: {
                character: 'https://i.ibb.co/wXtJwWY/Cat.jpg',
                food: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f41f.svg',
                counterText: 'Fish eaten'
            },
            zombie: {
                character: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f9df.svg',
                food: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f9e0.svg',
                counterText: 'Brains eaten'
            },
            tom: {
                character: 'https://i.ibb.co/bMQsT7W3/tom.png',
                food: 'https://i.ibb.co/ksKXxbQm/62-627718-free-png-tom-and-jerry-png-images-transparent.jpg',
                counterText: 'Jerry pots eaten'
            },
            bumblebee: {
                character: 'https://i.ibb.co/TMvVw5Dz/bumblebee.png',
                food: 'https://i.ibb.co/2Bg37tH/trump.jpg',
                counterText: 'Trumps eaten'
            }
        };

        // Celebration effects
        const cuteEmojis = [
            // Faces
            '😊', '😍', '🥰', '😘', '😚', '😙', '😋', '😛', '😜', '😝',
            '🤪', '🤩', '🥳', '😎', '🤗', '🤭', '🤫', '🤔', '🤨', '😐',
            '😑', '😶', '😏', '😒', '🙄', '😬', '🤥', '😌', '😔', '😪',
            '🤤', '😴', '😷', '🤒', '🤕', '🤢', '🤮', '🤧', '🥵', '🥶',
            '🥴', '😵', '🤯', '🤠', '🥳', '😇', '🤠', '🤡', '👻', '👽',
            // Hearts and symbols
            '❤️', '✨', '🌟', '🎉', '🎊', '🎈', '🎁', '🎀', '💝', '💖',
            '💕', '💗', '💓', '💞', '💘', '💟', '💌', '💋', '💐', '🌸',
            // Food
            '🍭', '🍬', '🍫', '🍩', '🍪', '🧁', '🎂', '🍰', '🍦', '🍨',
            '🍧', '🍡', '🍢', '🍥', '🍤', '🍣', '🍱', '🍛', '🍚', '🍙',
            '🍘', '🍗', '🍖', '🍕', '🍔', '🍟', '🌭', '🍿', '🍩', '🍪',
            // Animals
            '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯',
            '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🐤', '🦆',
            '🦅', '🦉', '🦇', '🐺', '🐗', '🐴', '🦄', '🐝', '🐛', '🦋',
            '🐌', '🐞', '🐜', '🦗', '🕷️', '🦂', '🐢', '🐍', '🦎', '🦖',
            '🦕', '🐙', '🦑', '🦐', '🦞', '🦀', '🐡', '🐠', '🐟', '🐬',
            '🐳', '🐋', '🦈', '🐊', '🐅', '🐆', '🦓', '🦍', '🦧', '🐘',
            '🦛', '🦏', '🐪', '🐫', '🦒', '🦘', '🐃', '🐂', '🐄', '🐎',
            '🐖', '🐏', '🐑', '🦙', '🐐', '🦌', '🐕', '🐩', '🦮', '🐕‍🦺',
            '🐈', '🐈‍⬛', '🐓', '🦃', '🦚', '🦜', '🦢', '🦩', '🕊️', '🐇',
            '🦝', '🦨', '🦡', '🦫', '🦦', '🦥', '🐁', '🐀', '🐿️', '🦔'
        ];

        function createHeart() {
            const numEmojis = Math.floor(Math.random() * 11) + 5; // Random number between 5 and 15
            
            for (let i = 0; i < numEmojis; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                const randomEmoji = cuteEmojis[Math.floor(Math.random() * cuteEmojis.length)];
                heart.innerHTML = randomEmoji;
                
                // Random position with some clustering around the center
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * Math.min(window.innerWidth, window.innerHeight) / 3;
                heart.style.left = (centerX + Math.cos(angle) * radius) + 'px';
                heart.style.top = (centerY + Math.sin(angle) * radius) + 'px';
                
                // Random size between 30px and 100px
                heart.style.fontSize = Math.random() * 70 + 30 + 'px';
                
                // Random rotation
                heart.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                // Random color for some emojis
                if (Math.random() > 0.5) {
                    heart.style.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                }
                
                // Random delay for each emoji
                const delay = Math.random() * 500;
                setTimeout(() => {
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 2000);
                }, delay);
            }
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        function createCelebrationText() {
            const text = document.createElement('div');
            text.className = 'celebration-text';
            text.textContent = 'Great Job!';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 2000);
        }

        function celebrate() {
            createHeart();
            createConfetti();
            createCelebrationText();
        }

        // Calculate the total distance and step size
        const bunnyArea = document.getElementById('bunnyArea');
        const totalDistance = bunnyArea.offsetWidth - 200;
        const stepSize = totalDistance / (lettersText.length - 1);
        let characterPosition = 50;

        function updateCounter() {
            const currentCharacter = characters[characterSelector.value];
            counter.textContent = `${currentCharacter.counterText}: ${foodEaten}`;
            
            // Check if we've reached a multiple of 5
            if (foodEaten > 0 && foodEaten % 1 === 0) {
                celebrate();
            }
        }

        function updateCharacters() {
            const currentCharacter = characters[characterSelector.value];
            character.style.backgroundImage = `url('${currentCharacter.character}')`;
            food.style.backgroundImage = `url('${currentCharacter.food}')`;
            updateCounter();
        }

        // Initialize characters
        updateCharacters();

        // Handle character selection change
        characterSelector.addEventListener('change', () => {
            updateCharacters();
            resetGame();
        });

        function resetGame() {
            letters.innerHTML = lettersText;
            currentIndex = 0;
            characterPosition = 50;
            character.style.left = `${characterPosition}px`;
            food.classList.remove('eating');
            // Reset all keys to semi-transparent
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.style.opacity = '0.1';
            });
        }

        // Finger mapping for QWERTY keyboard
        const fingerMapping = {
            'Q': 'finger-l-5', 'A': 'finger-l-5', 'Z': 'finger-l-5',
            'W': 'finger-l-4', 'S': 'finger-l-4', 'X': 'finger-l-4',
            'E': 'finger-l-3', 'D': 'finger-l-3', 'C': 'finger-l-2',
            'R': 'finger-l-2', 'F': 'finger-l-2', 'V': 'finger-l-2',
            'T': 'finger-l-2', 'G': 'finger-l-2', 'B': 'finger-l-2',
            'Y': 'finger-r-2', 'H': 'finger-r-2', 'N': 'finger-r-2',
            'U': 'finger-r-2', 'J': 'finger-r-2', 'M': 'finger-r-2',
            'I': 'finger-r-3', 'K': 'finger-r-3', ',': 'finger-r-3',
            'O': 'finger-r-4', 'L': 'finger-r-4', '.': 'finger-r-4',
            'P': 'finger-r-5', ';': 'finger-r-5', '/': 'finger-r-5'
        };

        // Create keyboard layout
        function createKeyboard() {
            const rows = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';'],
                ['Z', 'X', 'C', 'V', 'B', 'N', 'M', ',', '.', '/']
            ];

            rows.forEach(row => {
                row.forEach(key => {
                    const keyElement = document.createElement('div');
                    keyElement.className = `key ${fingerMapping[key] || ''}`;
                    keyElement.textContent = key;
                    keyboard.appendChild(keyElement);
                });
            });
        }

        // Initialize keyboard
        createKeyboard();

        // Update keyboard highlight
        function updateKeyboardHighlight(currentIndex) {
            const keys = document.querySelectorAll('.key');
            const nextLetter = lettersText[currentIndex];
            
            keys.forEach(key => {
                key.classList.remove('current');
                if (key.textContent === nextLetter) {
                    key.classList.add('current');
                    key.style.opacity = '1';
                } else {
                    key.style.opacity = '0.1';
                }
            });
        }

        // Initialize with first letter highlighted
        updateKeyboardHighlight(0);

        document.addEventListener('keydown', (event) => {
            const key = event.key.toUpperCase();
            const currentLetter = lettersText[currentIndex];

            if (key === currentLetter) {
                // Update letter color
                const span = document.createElement('span');
                span.textContent = currentLetter;
                span.className = 'typed';
                letters.innerHTML = letters.innerHTML.replace(currentLetter, span.outerHTML);

                // Move character
                characterPosition = 50 + (stepSize * currentIndex);
                character.style.left = `${characterPosition}px`;

                currentIndex++;

                // Update keyboard highlight for next letter
                updateKeyboardHighlight(currentIndex);

                // Check if character reached the food
                if (currentIndex >= lettersText.length) {
                    // Make character eat the food
                    food.classList.add('eating');
                    
                    setTimeout(() => {
                        foodEaten++;
                        updateCounter();
                        
                        // Reset game
                        resetGame();
                        // Reset keyboard highlight to first letter
                        updateKeyboardHighlight(0);
                    }, 500);
                }
            }
        });
    </script>
</body>
</html>
